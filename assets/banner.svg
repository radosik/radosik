<svg width="1280" height="340" viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Radomyr Moskalenko. Full-stack developer who also runs the infrastructure. Alicante, Spain.">
  <style>
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1117"/><stop offset="1" stop-color="#090B0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(985 40) scale(420 260)">
      <stop stop-color="#FF9F5A" stop-opacity=".16"/><stop offset="1" stop-color="#FF9F5A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="40" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151920"/><stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>

    <!-- left: identity -->
    <text x="72" y="92" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5B6473">~/radosik <tspan fill="#FF9F5A">$</tspan> whoami</text>
    <text x="70" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6" fill="#ECEFF4">Radomyr Moskalenko</text>
    <text x="72" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#8B95A5">Full-stack developer who also runs the infrastructure.</text>
    <text x="72" y="262" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#8B95A5">
      <tspan fill="#4ADE80" class="pulse">●</tspan><tspan dx="8">Alicante, ES</tspan><tspan dx="14" fill="#5B6473">/</tspan><tspan dx="14">TypeScript · Swift · Rust</tspan><tspan dx="14" fill="#5B6473">/</tspan><tspan dx="14">Workspace · AWS</tspan>
    </text>

    <!-- right: a laptop screen with the NotchTime island -->
    <rect x="808" y="40" width="420" height="330" rx="20" fill="url(#screen)" stroke="#232833"/>
    <!-- island -->
    <rect x="868" y="40" width="300" height="54" rx="22" fill="#000000"/>
    <rect x="868" y="40" width="300" height="24" fill="#000000"/>
    <circle cx="896" cy="70" r="5" fill="#FF9F5A" class="pulse"/>
    <text x="912" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#D9DEE6">profile redesign</text>
    <text x="1146" y="75" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#FFFFFF">01:24:37</text>

    <!-- faux editor -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#5B6473">
      <text y="138"><tspan x="840">01</tspan><tspan x="876" fill="#C792EA">const</tspan><tspan x="928" fill="#ECEFF4">stack</tspan><tspan x="978">= {</tspan></text>
      <text y="164"><tspan x="840">02</tspan><tspan x="900" fill="#8B95A5">build:</tspan><tspan x="960" fill="#A5E3A1">["ts", "swift", "rust"]</tspan><tspan>,</tspan></text>
      <text y="190"><tspan x="840">03</tspan><tspan x="900" fill="#8B95A5">run:</tspan><tspan x="960" fill="#A5E3A1">["workspace", "aws", "ad"]</tspan><tspan>,</tspan></text>
      <text y="216"><tspan x="840">04</tspan><tspan x="900" fill="#8B95A5">ships:</tspan><tspan x="960" fill="#FF9F5A">true</tspan><tspan>,</tspan></text>
      <text y="242"><tspan x="840">05</tspan><tspan x="876">}</tspan></text>
    </g>
    <rect x="892" y="230" width="8" height="16" fill="#FF9F5A" class="blink"/>
    <rect x="840" y="272" width="210" height="8" rx="4" fill="#FFFFFF" fill-opacity=".05"/>
    <rect x="840" y="292" width="150" height="8" rx="4" fill="#FFFFFF" fill-opacity=".04"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="339" rx="17.5" stroke="#FFFFFF" stroke-opacity=".07"/>
</svg>
